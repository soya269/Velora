
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#292723">

    <title>
        {% block title %}VELORA Admin{% endblock %}
    </title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">

    <!-- VELORA Admin Master CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='admin/css/style.css') }}">

    <!-- Page Specific CSS -->
    {% block extra_css %}{% endblock %}

</head>

<body>

    <!-- ======================================
         ADMIN CONTENT
    ======================================= -->

    <div class="wrapper">

        {% block content %}
        {% endblock %}

    </div>


    <!-- ======================================
         JAVASCRIPT
    ======================================= -->

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- VELORA Admin JavaScript -->
    <script src="{{ url_for('static', filename='admin/js/app.js') }}"></script>

    <!-- Page Specific JavaScript -->
    {% block extra_js %}{% endblock %}

</body>
</html>
