{% extends "front/admin/master.html" %}{% block title %}Add Category{% endblock %}{% block page_content %}<div class="card shadow-sm"><div class="card-body"><h2>Add Category</h2><form method="POST" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Name</label><input name="name" class="form-control" value="{{ category.name if category else request.form.get('name','') }}" required></div><div class="mb-3"><label class="form-label">Image</label><input type="file" name="image" class="form-control" accept="image/*"></div><div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="4">{{ category.description if category else request.form.get('description','') }}</textarea></div><button class="btn btn-primary">Save</button> <a href="{{ url_for('admin.admin_categories') }}" class="btn btn-secondary">Cancel</a></form></div></div>{% endblock %}
