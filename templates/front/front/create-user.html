
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create User | VELORA</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='front/style.css') }}">

    <style>
        :root {
            --black: #252525;
            --dark: #383838;
            --grey: #777777;
            --cream: #f7f6f2;
            --border: #e9e6df;
            --accent: #a38b6b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            color: var(--black);
            background: var(--cream);
        }

        /* Create User Section */
        .create-section {
            min-height: 85vh;
            padding: 75px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--cream);
        }

        /* Create User Card */
        .create-card {
            width: 100%;
            max-width: 490px;
            padding: 48px;
            background: #ffffff;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04);
        }

        .create-label {
            display: inline-block;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .create-title {
            margin-top: 16px;
            margin-bottom: 10px;
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 500;
            color: var(--black);
        }

        .create-description {
            margin-bottom: 30px;
            color: var(--grey);
            font-size: 14px;
            line-height: 1.7;
        }

        /* Form Labels */
        .create-form label {
            display: block;
            margin-bottom: 9px;
            color: var(--dark);
            font-size: 12px;
            font-weight: 600;
        }

        /* Form Inputs */
        .create-form .form-control,
        .create-form .form-select {
            height: 53px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 0;
            background: #ffffff;
            color: var(--black);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            box-shadow: none;
            transition: all 0.3s ease;
        }

        .create-form .form-control::placeholder {
            color: #999999;
        }

        .create-form .form-control:focus,
        .create-form .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(163, 139, 107, 0.08);
        }

        /* Create Button */
        .create-btn {
            width: 100%;
            height: 53px;
            margin-top: 5px;
            border: 1px solid var(--black);
            border-radius: 0;
            background: var(--black);
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .create-btn:hover {
            background: transparent;
            color: var(--black);
            border-color: var(--black);
        }

        /* Footer */
        .create-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--grey);
            font-size: 10px;
            letter-spacing: 2px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .create-section {
                padding: 45px 16px;
            }

            .create-card {
                padding: 38px 24px;
            }

            .create-title {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    {% include 'front/front/share/navbar.html' %}

    <main>

        <section class="create-section">

            <div class="create-card">

                <!-- Heading -->
                <span class="create-label">
                    VELORA ADMINISTRATION
                </span>

                <h1 class="create-title">
                    Create User
                </h1>

                <p class="create-description">
                    Add a new member to your VELORA team.
                    Complete the information below to create an account.
                </p>



                <!-- Create User Form -->
                <form method="POST"
                      action="{{ url_for('admin.create_user') }}"
                      class="create-form">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           name="csrf_token"
                           value="{{ csrf_token() }}">

                    <!-- Full Name -->
                    <div class="mb-3">
                        <label for="name">Full Name</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            class="form-control"
                            placeholder="Enter full name"
                            value="{{ request.form.get('name', '') }}"
                            autocomplete="name"
                            required>
                    </div>

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username">Username</label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Choose a username"
                            value="{{ request.form.get('username', '') }}"
                            autocomplete="username"
                            required>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="example@email.com"
                            value="{{ request.form.get('email', '') }}"
                            autocomplete="email"
                            required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter a password"
                            minlength="8"
                            autocomplete="new-password"
                            required>
                    </div>

                    <!-- User Role -->
                    <div class="mb-4">
                        <label for="role">User Role</label>

                        <select
                            id="role"
                            name="role"
                            class="form-select"
                            required>

                            <option value="staff"
                                    {% if request.form.get('role', 'staff') == 'staff' %}selected{% endif %}>
                                Staff
                            </option>

                            <option value="admin"
                                    {% if request.form.get('role') == 'admin' %}selected{% endif %}>
                                Admin
                            </option>

                        </select>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn create-btn">
                        Create User
                    </button>

                </form>

                <!-- Footer Text -->
                <div class="create-footer">
                    VELORA — ELEGANCE IN EVERY DETAIL
                </div>

            </div>

        </section>

    </main>

    {% include 'front/front/share/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
