
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | VELORA</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='front/style.css') }}">

    <style>
        :root {
            --black: #252525;
            --dark: #383838;
            --grey: #777777;
            --cream: #f7f6f2;
            --border: #e9e6df;
            --accent: #a38b6b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--black);
        }

        /* Reset Password Section */
        .reset-section {
            min-height: 85vh;
            padding: 75px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--cream);
        }

        /* Reset Password Card */
        .reset-card {
            width: 100%;
            max-width: 490px;
            padding: 48px;
            background: #ffffff;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04);
        }

        .reset-label {
            display: inline-block;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .reset-title {
            margin-top: 16px;
            margin-bottom: 10px;
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 500;
            color: var(--black);
        }

        .reset-description {
            margin-bottom: 30px;
            color: var(--grey);
            font-size: 14px;
            line-height: 1.7;
        }

        /* Form Inputs */
        .reset-form .form-control {
            height: 53px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 0;
            background: #ffffff;
            color: var(--black);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            box-shadow: none;
            transition: all 0.3s ease;
        }

        .reset-form .form-control::placeholder {
            color: #999999;
        }

        .reset-form .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(163, 139, 107, 0.08);
        }

        /* Update Password Button */
        .reset-btn {
            width: 100%;
            height: 53px;
            margin-top: 5px;
            border: 1px solid var(--black);
            border-radius: 0;
            background: var(--black);
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: transparent;
            color: var(--black);
            border-color: var(--black);
        }

        /* Login Link */
        .reset-login {
            margin-top: 28px;
            color: var(--grey);
            font-size: 13px;
            text-align: center;
        }

        .reset-login a {
            color: var(--black);
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
            transition: color 0.3s ease;
        }

        .reset-login a:hover {
            color: var(--accent);
        }


        /* Responsive */
        @media (max-width: 576px) {
            .reset-section {
                padding: 45px 16px;
            }

            .reset-card {
                padding: 38px 24px;
            }

            .reset-title {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    {% include 'front/front/share/navbar.html' %}

    <main>

        <section class="reset-section">

            <div class="reset-card">

                <!-- Heading -->
                <span class="reset-label">
                    RESET PASSWORD
                </span>

                <h1 class="reset-title">
                    Create New Password
                </h1>

                <p class="reset-description">
                    Enter your new password below to secure your
                    VELORA account.
                </p>
                <!-- Reset Password Form -->
                <form action="/reset-password"
                      method="POST"
                      class="reset-form">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           name="csrf_token"
                           value="{{ csrf_token() }}">

                    <!-- Email -->
                    <input type="hidden"
                           name="email"
                           value="{{ email }}">

                    <!-- New Password -->
                    <div class="mb-3">
                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                            placeholder="New Password"
                            minlength="8"
                            autocomplete="new-password"
                            required>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <input
                            type="password"
                            name="confirm_password"
                            id="confirm_password"
                            class="form-control"
                            placeholder="Confirm Password"
                            minlength="8"
                            autocomplete="new-password"
                            required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                            class="btn reset-btn">
                        Update Password
                    </button>

                    <!-- Back to Login -->
                    <div class="reset-login">
                        <a href="/login">
                            Back to Login
                        </a>
                    </div>

                </form>

            </div>

        </section>

    </main>

    {% include 'front/front/share/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
