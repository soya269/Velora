<header class="main-header">
    <div class="container nav-wrap">

        <!-- Brand Logo -->
        <a href="{{ url_for('front.home') }}" class="brand-logo">
            VELORA
        </a>

        <!-- Navigation Menu -->
        <nav class="nav-menu">
            <a href="{{ url_for('front.home') }}">Home</a>
            <a href="{{ url_for('front.about') }}">About</a>
            <a href="{{ url_for('front.shop') }}">Shop</a>
            <a href="{{ url_for('front.product_list') }}">Collection</a>
            <a href="{{ url_for('front.contact') }}">Contact</a>
        </nav>

        <!-- Navigation Actions -->
        <div class="nav-actions">

            {% if session.get('user') %}
                <a href="{{ url_for('front.account') }}">Account</a>
                <a href="{{ url_for('front.logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('front.login') }}">Login</a>
                <a href="{{ url_for('front.register') }}">Register</a>
            {% endif %}

            <!-- Shopping Bag -->
            <a href="{{ url_for('front.cart') }}" class="cart-btn">
                Bag
                {% if cart_count %}
                    <span class="cart-count">{{ cart_count }}</span>
                {% endif %}
            </a>

            <!-- Admin Dashboard -->
            {% if session.get('user', {}).get('role', '')|lower == 'admin' %}
                <a href="{{ url_for('admin.admin_dashboard') }}" class="admin-link">
                    Admin
                </a>
            {% endif %}

        </div>
    </div>
</header>
