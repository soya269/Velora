
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Name | VELORA</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='front/style.css') }}">

    <style>
        :root {
            --black: #252525;
            --dark: #383838;
            --grey: #777777;
            --cream: #f7f6f2;
            --border: #e9e6df;
            --accent: #a38b6b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--black);
        }

        /* Main Page Section */
        .page-section {
            min-height: 85vh;
            padding: 75px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--cream);
        }

        /* Content Card */
        .page-card {
            width: 100%;
            max-width: 900px;
            padding: 48px;
            background: #ffffff;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04);
        }

        /* Page Heading */
        .page-label {
            display: inline-block;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .page-title {
            margin-top: 16px;
            margin-bottom: 10px;
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 500;
            color: var(--black);
        }

        .page-description {
            margin-bottom: 30px;
            color: var(--grey);
            font-size: 14px;
            line-height: 1.7;
        }

        /* Page Content */
        .page-content {
            color: var(--dark);
            font-size: 14px;
            line-height: 1.8;
        }

        /* General Form Styling */
        .page-content .form-control,
        .page-content .form-select {
            min-height: 53px;
            border: 1px solid var(--border);
            border-radius: 0;
            padding: 12px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            box-shadow: none;
        }

        .page-content .form-control:focus,
        .page-content .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(163, 139, 107, 0.08);
        }

        /* General Button Styling */
        .page-content .btn-primary {
            min-height: 53px;
            padding: 12px 28px;
            border: 1px solid var(--black);
            border-radius: 0;
            background: var(--black);
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .page-content .btn-primary:hover {
            background: transparent;
            color: var(--black);
        }

        /* Responsive */
        @media (max-width: 576px) {
            .page-section {
                padding: 45px 16px;
            }

            .page-card {
                padding: 35px 23px;
            }

            .page-title {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    {% include 'front/front/share/navbar.html' %}

    <main>

        <section class="page-section">

            <div class="page-card">

                <!-- Page Header -->
                <span class="page-label">
                    VELORA
                </span>

                <h1 class="page-title">
                    Page Name
                </h1>

                <p class="page-description">
                    Add your page description here.
                </p>

                <!-- Page Content -->
                <div class="page-content">

                    <!-- Add your page content here -->

                </div>

            </div>

        </section>

    </main>

    {% include 'front/front/share/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
