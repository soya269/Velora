<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | VELORA</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='front/style.css') }}">

    <style>
        :root {
            --black: #252525;
            --dark: #383838;
            --grey: #777777;
            --cream: #f7f6f2;
            --border: #e9e6df;
            --accent: #a38b6b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--black);
        }

        /* Register Section */
        .register-section {
            min-height: 85vh;
            padding: 75px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--cream);
        }

        /* Register Card */
        .register-card {
            width: 100%;
            max-width: 490px;
            padding: 48px;
            background: #ffffff;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04);
        }

        .register-label {
            display: inline-block;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .register-title {
            margin-top: 16px;
            margin-bottom: 10px;
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 500;
            color: var(--black);
        }

        .register-description {
            margin-bottom: 30px;
            color: var(--grey);
            font-size: 14px;
            line-height: 1.7;
        }

        /* Form Inputs */
        .register-form .form-control {
            height: 53px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 0;
            background: #ffffff;
            color: var(--black);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            box-shadow: none;
            transition: all 0.3s ease;
        }

        .register-form .form-control::placeholder {
            color: #999999;
        }

        .register-form .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(163, 139, 107, 0.08);
        }

        /* Register Button */
        .register-btn {
            width: 100%;
            height: 53px;
            margin-top: 5px;
            border: 1px solid var(--black);
            border-radius: 0;
            background: var(--black);
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .register-btn:hover {
            background: transparent;
            color: var(--black);
            border-color: var(--black);
        }

        /* Login Link */
        .register-login {
            margin-top: 28px;
            color: var(--grey);
            font-size: 13px;
            text-align: center;
        }

        .register-login a {
            margin-left: 4px;
            color: var(--black);
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
            transition: color 0.3s ease;
        }

        .register-login a:hover {
            color: var(--accent);
        }




        /* Responsive */
        @media (max-width: 576px) {
            .register-section {
                padding: 45px 16px;
            }

            .register-card {
                padding: 38px 24px;
            }

            .register-title {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    {% include 'front/front/share/navbar.html' %}

    <main>

        <section class="register-section">

            <div class="register-card">

                <!-- Heading -->
                <span class="register-label">
                    JOIN VELORA
                </span>

                <h1 class="register-title">
                    Create Account
                </h1>

                <p class="register-description">
                    Become part of our premium fashion house.
                    Create your account and discover timeless style.
                </p>


                <!-- Register Form -->
                <form action="/register"
                      method="POST"
                      class="register-form">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           name="csrf_token"
                           value="{{ csrf_token() }}">

                    <!-- First Name and Last Name -->
                    <div class="row g-3 mb-3">

                        <div class="col-6">
                            <input
                                type="text"
                                name="first_name"
                                class="form-control"
                                placeholder="First Name"
                                value="{{ request.form.get('first_name', '') }}"
                                autocomplete="given-name"
                                required>
                        </div>

                        <div class="col-6">
                            <input
                                type="text"
                                name="last_name"
                                class="form-control"
                                placeholder="Last Name"
                                value="{{ request.form.get('last_name', '') }}"
                                autocomplete="family-name"
                                required>
                        </div>

                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Email Address"
                            value="{{ request.form.get('email', '') }}"
                            autocomplete="email"
                            required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                            placeholder="Password"
                            autocomplete="new-password"
                            required>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <input
                            type="password"
                            name="confirm_password"
                            id="confirm_password"
                            class="form-control"
                            placeholder="Confirm Password"
                            autocomplete="new-password"
                            required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                            class="btn register-btn">
                        Create Account
                    </button>

                    <!-- Login Link -->
                    <div class="register-login">
                        Already have an account?
                        <a href="/login">Login</a>
                    </div>

                </form>

            </div>

        </section>

    </main>

    {% include 'front/front/share/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
